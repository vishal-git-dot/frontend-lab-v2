<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnetic Button · Frontend Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../../assets/css/experiment-shell.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-bar">
      <a class="shell-back" href="../../../index.html">← Frontend Lab</a>
      <span class="shell-tag">buttons / magnetic-button</span>
    </header>

    <main class="shell-stage">
      <div class="stage-frame">
        <button class="magnetic-btn" id="magneticBtn">
          <span>Hover me</span>
        </button>
      </div>
    </main>

    <footer class="shell-info">
      <h1>Magnetic Button</h1>
      <p>
        The button tracks the cursor within a small radius and leans
        toward it, then springs back to center on mouse leave. Built
        with one <code>mousemove</code> listener and a CSS transition
        for the return trip.
      </p>
      <div class="shell-files">
        <a href="style.css" target="_blank">style.css</a>
        <a href="script.js" target="_blank">script.js</a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
