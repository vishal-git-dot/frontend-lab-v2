<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div class="shell">
    <header class="shell-bar">
      <a class="shell-back" href="../../../index.html">← Frontend Lab</a>
      <span class="shell-tag">cards / spotlight-card</span>
    </header>

    <main class="shell-stage">
      <div class="stage-frame">
        <div class="spotlight-card" id="spotlightCard">
          <h3>Spotlight Card</h3>
          <p>Move your cursor across the surface.</p>
        </div>
      </div>
    </main>

    <footer class="shell-info">
      <h1>Spotlight Card</h1>
      <p>
        A radial gradient positioned with two CSS custom properties,
        <code>--x</code> and <code>--y</code>, updated on
        <code>mousemove</code>. The gradient itself is pure CSS; the
        script only ever writes two numbers.
      </p>
      <div class="shell-files">
        <a href="style.css" target="_blank">style.css</a>
        <a href="script.js" target="_blank">script.js</a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
