<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tilt Card · Frontend Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../../assets/css/experiment-shell.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-bar">
      <a class="shell-back" href="../../../index.html">← Frontend Lab</a>
      <span class="shell-tag">cards / tilt-card</span>
    </header>

    <main class="shell-stage">
      <div class="stage-frame">
        <div class="tilt-card" id="tiltCard">
          <div class="tilt-card-glare" id="tiltGlare"></div>
          <h3>Tilt Card</h3>
          <p>Move your cursor across this card.</p>
        </div>
      </div>
    </main>

    <footer class="shell-info">
      <h1>Tilt Card</h1>
      <p>
        On <code>mousemove</code>, the cursor's position relative to
        the card's center is mapped to a small <code>rotateX</code> /
        <code>rotateY</code>, giving the illusion of a 3D surface. A
        soft glare layer tracks along with it.
      </p>
      <div class="shell-files">
        <a href="style.css" target="_blank">style.css</a>
        <a href="script.js" target="_blank">script.js</a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
