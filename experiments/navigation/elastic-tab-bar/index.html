<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elastic Tab Bar · Frontend Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../../assets/css/experiment-shell.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="shell-bar">
      <a class="shell-back" href="../../../index.html">← Frontend Lab</a>
      <span class="shell-tag">navigation / elastic-tab-bar</span>
    </header>

    <main class="shell-stage">
      <div class="stage-frame">
        <div class="elastic-tabs" id="elasticTabs" role="tablist">
          <span class="elastic-indicator" id="elasticIndicator"></span>
          <button class="elastic-tab is-active" role="tab" aria-selected="true">Design</button>
          <button class="elastic-tab" role="tab" aria-selected="false">Build</button>
          <button class="elastic-tab" role="tab" aria-selected="false">Ship</button>
        </div>
      </div>
    </main>

    <footer class="shell-info">
      <h1>Elastic Tab Bar</h1>
      <p>
        A single indicator element sits behind the tabs. On click, its
        <code>transform</code> and <code>width</code> are set from the
        clicked tab's own <code>offsetLeft</code> / <code>offsetWidth</code>,
        and a slight overshoot easing gives it that stretchy snap.
      </p>
      <div class="shell-files">
        <a href="style.css" target="_blank">style.css</a>
        <a href="script.js" target="_blank">script.js</a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
